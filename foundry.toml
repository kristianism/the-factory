[profile.default]
src = "src"
out = "out"
libs = ["lib", "node_modules"]
solc = "0.8.36"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
# Forward-compatibility identifier warnings in pinned upstream dependencies.
ignored_error_codes = [6335]

[profile.ci.fuzz]
runs = 1000

[fmt]
line_length = 120
